[package]
name = "modeling"
version = "0.1.0"
edition = "2024"

[features]
# Mac Users: `cargo run --features metal`
# 3080 Ti Users: `cargo run --features cuda`
default = []
metal = ["candle-core/metal", "candle-nn/metal", "candle-transformers/metal"]
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]

[dependencies]
anyhow = "1.0.104"
candle-core = "0.11.0"
candle-nn = "0.11.0"
candle-transformers = "0.11.0"
hf-hub = "0.3.2"
serde_json = "1.0.151"
tokenizers = "0.23.2"
